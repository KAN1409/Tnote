name: Android quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Fetch pinned offline models
        run: ./scripts/bootstrap-offline-models.sh
      - name: Build, test, and lint
        run: ./gradlew --no-daemon --no-configuration-cache clean assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tnote-2.4.0-cloud-provider-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package Android APK signing tool
        run: |
          tools_dir="$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)")"
          tar -czf apksigner-tools.tgz -C "$tools_dir" apksigner lib/apksigner.jar
      - name: Upload APK signing tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tools
          path: apksigner-tools.tgz
          if-no-files-found: error
