name: Android quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Fetch pinned offline models
        run: ./scripts/bootstrap-offline-models.sh
      - name: Guard update identity
        run: |
          grep -q 'applicationId = "com.aistudio.voicenotes.vnapp"' app/build.gradle.kts
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "2.3.0"' app/build.gradle.kts
          grep -q '@Database(entities = \[NoteEntity::class\], version = 3' app/src/main/java/com/example/data/local/AppDatabase.kt
          grep -q 'MIGRATION_2_3' app/src/main/java/com/example/data/local/AppDatabase.kt
          # Debug builds use the Android debug certificate. Release/update signing is gated separately
          # when release keystore credentials are explicitly supplied; never invent a signing identity.
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            test -f "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" >/dev/null
          fi
      - name: Build, test, and lint
        run: ./gradlew --no-daemon --no-configuration-cache clean assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tnote-2.3.0-capture-rebuild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
